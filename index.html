<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Лёгкий заработок — профилактическая мини-игра о схемах вовлечения через мессенджер.">
<title>Лёгкий заработок</title>
<style>
  :root {
    --bg: #070b10;
    --chat-bg: #0f1720;
    --bubble-other: #1a2433;
    --bubble-me: #1d9bf0;
    --bubble-me-end: #1a8cd8;
    --text: #f0f3f6;
    --text-muted: #8b98a5;
    --btn: #1d9bf0;
    --glow: rgba(29,155,240,0.25);
    --border: rgba(255,255,255,0.06);
    --success: #00ba7c;
    --warn: #ffad1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 120% 80% at 50% -30%, rgba(29,155,240,0.08), transparent 50%),
      radial-gradient(ellipse 80% 50% at 100% 100%, rgba(238,90,36,0.04), transparent 40%);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* PROLOGUE — phone lock / notification */
  .prologue {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: calc(56px + env(safe-area-inset-top, 0px)) 18px 24px;
    background:
      radial-gradient(ellipse 120% 80% at 50% 0%, rgba(40,60,100,0.45), transparent 55%),
      linear-gradient(180deg, #0a1018 0%, #070b10 40%, #0b1220 100%);
    animation: fadeIn 0.45s ease;
    cursor: default;
  }
  .prologue.hidden { display: none; }
  .lock-time {
    text-align: center;
    color: #fff;
    margin-bottom: 6px;
    user-select: none;
  }
  .lock-time .hhmm {
    font-size: 64px;
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .lock-time .date {
    font-size: 16px;
    color: rgba(255,255,255,0.75);
    margin-top: 6px;
  }
  .lock-hint {
    margin-top: auto;
    margin-bottom: 28px;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    text-align: center;
  }
  .phone-notif {
    width: 100%;
    max-width: 380px;
    margin-top: 36px;
    background: rgba(40, 48, 62, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 14px 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    cursor: pointer;
    text-align: left;
    animation: notifDrop 0.55s cubic-bezier(0.22,1,0.36,1) both;
    transition: transform 0.15s ease, opacity 0.15s;
  }
  .phone-notif:active {
    transform: scale(0.98);
    opacity: 0.92;
  }
  @keyframes notifDrop {
    from { opacity: 0; transform: translateY(-24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .phone-notif .n-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .phone-notif .n-app-icon {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg, #1d9bf0, #0d8a6a);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .phone-notif .n-app {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
  }
  .phone-notif .n-when {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-left: auto;
  }
  .phone-notif .n-body-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .phone-notif .n-av {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
    flex-shrink: 0;
  }
  .phone-notif .n-text { min-width: 0; flex: 1; }
  .phone-notif .n-title {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 2px;
  }
  .phone-notif .n-msg {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .phone-notif .n-open {
    margin-top: 10px;
    font-size: 12px;
    color: #5eb3ff;
    font-weight: 600;
  }

  .header {
    background: rgba(15,23,32,0.92);
    backdrop-filter: blur(12px);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 10;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; position: relative;
    box-shadow: 0 2px 12px rgba(238,90,36,0.35);
  }
  .avatar .dot {
    position: absolute; bottom: 0; right: 0;
    width: 11px; height: 11px; background: var(--success);
    border: 2px solid var(--chat-bg); border-radius: 50%;
    animation: pulseDot 2.5s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%,100% { box-shadow: 0 0 0 0 rgba(0,186,124,0.4); }
    50% { box-shadow: 0 0 0 4px transparent; }
  }
  .header-info { flex: 1; min-width: 0; }
  .header-info h1 { font-size: 15px; font-weight: 600; }
  .header-info span { font-size: 12px; color: var(--text-muted); }
  .timer-badge {
    font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 20px;
    background: rgba(255,173,31,0.15);
    color: var(--warn);
    border: 1px solid rgba(255,173,31,0.3);
    display: none;
    font-variant-numeric: tabular-nums;
  }
  .timer-badge.urgent {
    background: rgba(244,33,46,0.15);
    color: #ff6b6b;
    border-color: rgba(244,33,46,0.35);
    animation: timerPulse 1s ease infinite;
  }
  @keyframes timerPulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .chat {
    flex: 1; overflow-y: auto;
    padding: 14px 12px;
    display: flex; flex-direction: column; gap: 8px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 85%; padding: 11px 14px;
    border-radius: 18px; font-size: 15px; line-height: 1.45;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .msg.other {
    background: var(--bubble-other);
    align-self: flex-start; border-bottom-left-radius: 5px;
    animation: msgInLeft 0.35s cubic-bezier(0.22,1,0.36,1) both;
  }
  .msg.me {
    background: linear-gradient(145deg, var(--bubble-me), var(--bubble-me-end));
    align-self: flex-end; border-bottom-right-radius: 5px;
    animation: msgInRight 0.35s cubic-bezier(0.22,1,0.36,1) both;
    box-shadow: 0 2px 10px var(--glow);
  }
  .msg.system {
    align-self: center; background: transparent;
    color: var(--text-muted); font-size: 12.5px;
    text-align: center; max-width: 92%; padding: 6px 10px;
    box-shadow: none; animation: fadeIn 0.4s ease both;
  }
  /* System push notification (top toast) */
  .toast-notif {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 300;
    display: flex;
    justify-content: center;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 0;
    pointer-events: none;
    transform: translateY(-120%);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.22,1,0.36,1), opacity 0.35s ease;
  }
  .toast-notif.show {
    transform: translateY(0);
    opacity: 1;
  }
  .toast-notif.hide {
    transform: translateY(-120%);
    opacity: 0;
  }
  .toast-inner {
    width: 100%;
    max-width: 380px;
    background: rgba(30, 36, 48, 0.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }
  .toast-top {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px;
  }
  .toast-av {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, #7c5cff, #5a8dee);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .toast-name { font-size: 13px; font-weight: 600; }
  .toast-app { font-size: 11px; color: var(--text-muted); margin-left: auto; }
  .toast-body { font-size: 14px; color: var(--text-muted); line-height: 1.4; }
  @keyframes msgInLeft {
    from { opacity: 0; transform: translateX(-14px) scale(0.96); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes msgInRight {
    from { opacity: 0; transform: translateX(14px) scale(0.96); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .msg .time {
    font-size: 10.5px; color: rgba(255,255,255,0.35);
    margin-top: 4px; text-align: right;
  }
  .msg.other .time { text-align: left; }

  .msg.attach {
    background: var(--bubble-other);
    align-self: flex-start; border-bottom-left-radius: 5px;
    padding: 7px; max-width: 78%;
    animation: msgInLeft 0.4s cubic-bezier(0.22,1,0.36,1) both;
  }
  .attach-card {
    border-radius: 12px; overflow: hidden;
    background: #0a121a; border: 1px solid rgba(255,255,255,0.06);
  }
  .attach-preview {
    height: 120px; display: flex; align-items: center; justify-content: center;
    position: relative;
    background: linear-gradient(145deg, #1a2634, #0f1822);
  }
  .attach-preview.map {
    background:
      linear-gradient(90deg, rgba(45,100,140,0.12) 1px, transparent 1px),
      linear-gradient(rgba(45,100,140,0.12) 1px, transparent 1px),
      radial-gradient(circle at 40% 55%, rgba(29,155,240,0.18), transparent 45%),
      linear-gradient(145deg, #15202b, #0d1520);
    background-size: 18px 18px, 18px 18px, 100% 100%, 100% 100%;
  }
  .attach-preview .badge {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(0,0,0,0.6); color: #fff;
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
  }
  .attach-meta { padding: 8px 10px; }
  .attach-meta .label { font-size: 13px; font-weight: 600; }
  .attach-meta .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* Voice message */
  .msg.voice {
    background: var(--bubble-other);
    align-self: flex-start; border-bottom-left-radius: 5px;
    padding: 12px 14px; max-width: 80%;
    animation: msgInLeft 0.35s cubic-bezier(0.22,1,0.36,1) both;
  }
  .voice-row {
    display: flex; align-items: center; gap: 10px;
  }
  .voice-play {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--btn);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    box-shadow: 0 2px 8px var(--glow);
  }
  .voice-wave {
    flex: 1; height: 28px;
    display: flex; align-items: center; gap: 2px;
  }
  .voice-wave i {
    display: block; width: 3px; border-radius: 2px;
    background: rgba(255,255,255,0.35);
    animation: wave 1.2s ease-in-out infinite;
  }
  .voice-wave i:nth-child(odd) { height: 10px; }
  .voice-wave i:nth-child(even) { height: 18px; animation-delay: 0.15s; }
  .voice-wave i:nth-child(3n) { height: 14px; animation-delay: 0.3s; }
  @keyframes wave {
    0%,100% { transform: scaleY(0.7); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  .voice-dur { font-size: 11px; color: var(--text-muted); margin-left: 4px; }
  .voice-transcript {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 13px; color: var(--text-muted); line-height: 1.4;
  }

  .typing {
    align-self: flex-start; background: var(--bubble-other);
    padding: 14px 18px; border-radius: 18px;
    border-bottom-left-radius: 5px; display: none;
  }
  .typing span {
    display: inline-block; width: 7px; height: 7px;
    background: var(--text-muted); border-radius: 50%; margin: 0 2px;
    animation: bounce 1.35s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%,80%,100% { transform: scale(0.5); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .options {
    background: rgba(15,23,32,0.95);
    backdrop-filter: blur(12px);
    padding: 12px 12px 16px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
    flex-shrink: 0; max-height: 42vh; overflow-y: auto;
  }
  .opt-btn {
    background: linear-gradient(180deg, #239bff, #1a8cd8);
    color: #fff; border: none;
    padding: 14px 16px; border-radius: 14px;
    font-size: 15px; font-weight: 500; text-align: left;
    cursor: pointer; min-height: 50px;
    box-shadow: 0 2px 12px var(--glow), inset 0 1px 0 rgba(255,255,255,0.12);
    animation: optIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
    opacity: 0;
  }
  .opt-btn:nth-child(1) { animation-delay: 0.05s; }
  .opt-btn:nth-child(2) { animation-delay: 0.1s; }
  .opt-btn:nth-child(3) { animation-delay: 0.15s; }
  .opt-btn:nth-child(4) { animation-delay: 0.2s; }
  .opt-btn:nth-child(5) { animation-delay: 0.25s; }
  @keyframes optIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .opt-btn:active { transform: scale(0.98); filter: brightness(0.95); }

  .ending {
    display: none;
    flex-direction: column;
    position: fixed;
    inset: 0;
    z-index: 50;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 28px 20px 40px;
    animation: endingIn 0.5s cubic-bezier(0.22,1,0.36,1);
    background: var(--bg);
    background-image: radial-gradient(ellipse 100% 60% at 50% 0%, rgba(29,155,240,0.1), transparent 55%);
  }
  @keyframes endingIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ending h2 { font-size: 22px; margin-bottom: 6px; text-align: center; font-weight: 700; }
  .ending .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }
  .ending p, .ending li { font-size: 15px; line-height: 1.55; margin-bottom: 8px; }
  .ending ul { padding-left: 20px; margin-bottom: 12px; }
  .ending .card {
    background: var(--bubble-other);
    border-radius: 16px; padding: 16px 18px;
    margin: 12px 0; border: 1px solid var(--border);
  }
  .ending .card h3 {
    font-size: 14px; margin-bottom: 10px;
    color: var(--warn); font-weight: 600;
  }
  .ending .card.techniques h3 { color: #ff8a8a; }
  .ending .card.legal h3 { color: #7db7ff; }
  .ending .card.flags-check h3 { color: #ffad1f; }
  .ending .card.mirror h3 { color: #c4b5fd; }
  .ending .card.takeaway h3 { color: #7dd3fc; }
  .ending .card.meaning h3 { color: #9ae6b4; }
  .ending .flags h3 {
    font-size: 12px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .flag-item, .tech-item, .check-item { margin: 6px 0; font-size: 14px; line-height: 1.4; }
  .ending .closing {
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    margin: 16px 0 8px;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(29,155,240,0.08);
    border: 1px solid rgba(29,155,240,0.2);
    font-weight: 500;
  }
  .replay-box {
    background: rgba(29,155,240,0.1);
    border: 1px solid rgba(29,155,240,0.25);
    border-radius: 14px; padding: 14px 16px;
    margin: 12px 0; text-align: center;
  }
  .replay-box .count { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .replay-box .tease { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
  .restart-btn, .secondary-btn {
    color: #fff; border: none; padding: 16px;
    border-radius: 14px; font-size: 16px; font-weight: 600;
    margin-top: 10px; cursor: pointer;
    width: 100%;
  }
  .restart-btn {
    background: linear-gradient(180deg, #239bff, #1a8cd8);
    box-shadow: 0 4px 20px var(--glow);
  }
  .restart-btn:active, .secondary-btn:active { transform: scale(0.98); }
  .secondary-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--text);
    box-shadow: none;
  }
  .secondary-btn.copied {
    border-color: rgba(0,186,124,0.5);
    color: #7ddec4;
  }
  .quiz-card { margin-top: 8px; }
  .quiz-q {
    margin: 14px 0 8px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 6px 0;
    font-size: 14px;
    cursor: pointer;
  }
  .quiz-opt:disabled { cursor: default; }
  .quiz-opt.correct {
    border-color: rgba(0,186,124,0.55);
    background: rgba(0,186,124,0.12);
  }
  .quiz-opt.wrong {
    border-color: rgba(244,33,46,0.45);
    background: rgba(244,33,46,0.1);
  }
  .quiz-result {
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.45;
    color: var(--text-muted);
  }
  .quiz-result strong { color: var(--text); }
  .btn-row { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="toast-notif" id="toastNotif" aria-live="polite">
  <div class="toast-inner">
    <div class="toast-top">
      <div class="toast-av" id="toastAv">М</div>
      <span class="toast-name" id="toastName">Мама</span>
      <span class="toast-app">сейчас</span>
    </div>
    <div class="toast-body" id="toastBody">Ты где? Когда будешь дома?</div>
  </div>
</div>

<!-- PROLOGUE -->
<div class="prologue" id="prologue">
  <div class="lock-time">
    <div class="hhmm" id="lockTime">12:00</div>
    <div class="date" id="lockDate"></div>
  </div>
  <button type="button" class="phone-notif" id="startBtn" aria-label="Открыть сообщение">
    <div class="n-top">
      <div class="n-app-icon">💬</div>
      <span class="n-app">Сообщения</span>
      <span class="n-when">сейчас</span>
    </div>
    <div class="n-body-row">
      <div class="n-av" id="lockAv">А</div>
      <div class="n-text">
        <div class="n-title" id="lockTitle">Алекс | Подработка</div>
        <div class="n-msg" id="lockPreview">Привет! Есть вариант подработки — курьер, хорошие деньги…</div>
      </div>
    </div>
    <div class="n-open">Открыть</div>
  </button>
  <div class="lock-hint"></div>
</div>

<div class="header hidden" id="header">
  <div class="avatar" id="avatarLetter">А<div class="dot"></div></div>
  <div class="header-info">
    <h1 id="contactTitle">Алекс | Подработка</h1>
    <span id="statusText">в сети</span>
  </div>
</div>

<div class="chat hidden" id="chat"></div>
<div class="typing" id="typing"><span></span><span></span><span></span></div>
<div class="options hidden" id="options"></div>
<div class="ending" id="ending"></div>

<script>
const chatEl = document.getElementById("chat");
const typingEl = document.getElementById("typing");
const optionsEl = document.getElementById("options");
const endingEl = document.getElementById("ending");
const headerEl = document.getElementById("header");
const statusText = document.getElementById("statusText");

function now() {
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}
function addMsg(from, text) {
  const div = document.createElement("div");
  div.className = "msg " + from;
  div.innerHTML = text.replace(/\n/g,"<br>") + (from !== "system" ? `<div class="time">${now()}</div>` : "");
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addAttach(kind, title, sub) {
  const icon = kind === "map" ? "📍" : kind === "drop" ? "📦" : "📷";
  const badge = kind === "map" ? "Геолокация" : "Фото";
  const div = document.createElement("div");
  div.className = "msg attach";
  div.innerHTML = `<div class="attach-card">
    <div class="attach-preview${kind==="map"?" map":""}">
      <span style="font-size:36px;position:relative;z-index:1">${icon}</span>
      <span class="badge">${badge}</span>
    </div>
    <div class="attach-meta"><div class="label">${title}</div><div class="sub">${sub||"Вложение"}</div></div>
  </div><div class="time">${now()}</div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addVoice(duration, transcript) {
  flags.heardVoice = true;
  const bars = Array.from({length: 12}, () => "<i></i>").join("");
  const div = document.createElement("div");
  div.className = "msg voice";
  div.innerHTML = `
    <div class="voice-row">
      <div class="voice-play">▶</div>
      <div class="voice-wave">${bars}</div>
      <span class="voice-dur">${duration}</span>
    </div>
    <div class="voice-transcript">${transcript}</div>
    <div class="time">${now()}</div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addNotif(name, body) {
  flags.sawNotif = true;
  const toast = document.getElementById("toastNotif");
  document.getElementById("toastAv").textContent = (name && name[0]) || "?";
  document.getElementById("toastName").textContent = name || "Сообщение";
  document.getElementById("toastBody").textContent = body || "";
  toast.classList.remove("hide");
  // force reflow so animation restarts
  void toast.offsetWidth;
  toast.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    toast.classList.remove("show");
    toast.classList.add("hide");
  }, 9000);
}
function showTyping(v) {
  typingEl.style.display = v ? "block" : "none";
  if (v) chatEl.scrollTop = chatEl.scrollHeight;
}
function setStatus(t) { statusText.textContent = t; }

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

function applyPersona() {

function renderQuiz(container) {
  let score = 0;
  let answered = 0;
  const total = QUIZ.length;
  container.innerHTML = `<h3>Проверь себя</h3><p style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">4 коротких вопроса — закрепить мысль.</p>`;
  QUIZ.forEach((item, qi) => {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="quiz-q">${qi + 1}. ${item.q}</div>`;
    item.options.forEach((opt, oi) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "quiz-opt";
      b.textContent = opt.t;
      b.onclick = () => {
        if (b.disabled) return;
        // lock this question
        wrap.querySelectorAll("button").forEach(x => { x.disabled = true; });
        if (opt.ok) {
          b.classList.add("correct");
          score++;
        } else {
          b.classList.add("wrong");
          wrap.querySelectorAll("button").forEach((x, idx) => {
            if (item.options[idx] && item.options[idx].ok) x.classList.add("correct");
          });
        }
        answered++;
        if (answered === total) {
          const res = document.createElement("div");
          res.className = "quiz-result";
          let msg = "";
          if (score === total) msg = "Отличный результат. Ты уже замечаешь типичные крючки схемы.";
          else if (score >= 3) msg = "Хорошо. Имеет смысл ещё раз глянуть чеклист красных флагов выше.";
          else msg = "Это нормально — для этого и нужна профилактика. Перечитай флаги и пройди игру другим путём.";
          res.innerHTML = `<strong>Результат: ${score} из ${total}</strong><br>${msg}`;
          container.appendChild(res);
        }
      };
      wrap.appendChild(b);
    });
    container.appendChild(wrap);
  });
}

function collectFlags() {
  const list = [];
  if (flags.askedProduct) list.push("Уточнял товар");
  if (flags.askedMoney) list.push("Спрашивал про деньги");
  if (flags.askedLegal) list.push("Спрашивал про законность");
  if (flags.askedHow) list.push("Уточнял схему");
  if (flags.askedHaste) list.push("Спрашивал про спешку");
  if (flags.askedOpen) list.push("Спрашивал, почему нельзя открыть");
  if (flags.wasSuspicious) list.push("Выражал подозрения");
  if (flags.gaveData) list.push("Передал данные");
  if (flags.reachedTask) list.push("Дошёл до «точки»");
  if (flags.tookPackage) list.push("«Забрал» пакет");
  if (flags.finishedTask) list.push("Подтвердил сброс");
  if (flags.threatenedReport) list.push("Говорил о переписке / сообщении");
  if (flags.sawNotif) list.push("Пришло «сообщение извне»");
  if (flags.heardVoice) list.push("Получил голосовое");
  if (flags.triedNoCard) list.push("Просил «без карты, только фото»");
  if (flags.citedFriend) list.push("Ссылался на друга");
  if (flags.askedMeet) list.push("Просил звонок или встречу");
  return list;
}

function collectTech() {
  return Object.keys(techniques).filter(k => techniques[k]).map(k => TECH_LABELS[k]);
}

function buildMirror() {
  if (stepChain.length) return stepChain.slice();
  const order = [
    "_interest", "askedHow", "askedProduct", "askedMoney", "askedLegal",
    "askedOpen", "askedHaste", "wasSuspicious", "citedFriend", "askedMeet",
    "triedNoCard", "gaveData", "reachedTask", "tookPackage", "finishedTask",
    "threatenedReport", "refusedEarly", "refusedLate"
  ];
  const out = [];
  order.forEach(k => {
    if (flags[k] && STEP_LABELS[k]) out.push(STEP_LABELS[k]);
    // _interest only from stepChain
  });
  return out;
}

let playing = false;

function pushStep(flag) {
  if (!flag) return;
  const label = STEP_LABELS[flag];
  if (!label) return;
  if (stepChain.indexOf(label) !== -1) return;
  stepChain.push(label);
}

function chooseOption(opt) {
  if (playing) return;
  playing = true;
  optionsEl.innerHTML = "";
  if (opt.flag && Object.prototype.hasOwnProperty.call(flags, opt.flag)) {
    flags[opt.flag] = true;
    pushStep(opt.flag);
  }
  if (opt.next === "agree_start") pushStep("_interest");
  if (opt.next === "give_data") pushStep("gaveData");
  if (opt.next === "on_the_way" || opt.next === "task_look") pushStep("reachedTask");
  if (opt.next === "got_package") pushStep("tookPackage");
  if (opt.next === "end_task_done") pushStep("finishedTask");
  if (opt.next === "end_block" || opt.next === "end_ignore") {
    if (!flags.refusedLate && !flags.refusedEarly) pushStep("refusedEarly");
  }

  setTimeout(() => {
    playNode(opt.next).catch(err => {
      /* silent */
      try { showEnding("ignore"); } catch (e) { location.reload(); }
    }).finally(() => { playing = false; });
  }, 40);
}

async function playNode(id) {
  const node = story[id];
  if (!node) {
    /* unknown node */
    showEnding("ignore");
    return;
  }

  // Ending node — leave chat cleanly
  if (node.ending) {
    showTyping(false);
    stopTimer();
    await new Promise(r => setTimeout(r, 400));
    showEnding(node.ending);
    return;
  }

  if (node.stopTimer) stopTimer();

  if (node.tech) {
    node.tech.forEach(t => { if (Object.prototype.hasOwnProperty.call(techniques, t)) techniques[t] = true; });
  }

  // Style-specific lines if provided
  let msgList = node.messages || [];
  const st = (currentPersona && currentPersona.style) || "soft";
  if (node.byStyle && node.byStyle[st]) {
    msgList = node.byStyle[st];
  }

  // Messages — slower pace
  for (const m of msgList) {
    if (m.from === "other") {
      setStatus("печатает...");
      showTyping(true);
      const delay = 700 + Math.random() * 700 + Math.min(900, (m.text || "").length * 10);
      await new Promise(r => setTimeout(r, delay));
      showTyping(false);
      setStatus("в сети");
    } else if (m.from === "system") {
      await new Promise(r => setTimeout(r, 400));
    } else {
      await new Promise(r => setTimeout(r, 280));
    }
    addMsg(m.from, m.text);
  }

  if (node.voice) {
    setStatus("голосовое...");
    await new Promise(r => setTimeout(r, 700));
    addVoice(node.voice.dur, node.voice.text);
    setStatus("в сети");
    await new Promise(r => setTimeout(r, 400));
  }

  if (node.messagesAfterVoice) {
    for (const m of node.messagesAfterVoice) {
      setStatus("печатает...");
      showTyping(true);
      const delay = 650 + Math.random() * 550 + Math.min(800, (m.text || "").length * 9);
      await new Promise(r => setTimeout(r, delay));
      showTyping(false);
      setStatus("в сети");
      addMsg(m.from, m.text);
    }
  }

  if (node.attach) {
    for (const a of node.attach) {
      await new Promise(r => setTimeout(r, 550));
      addAttach(a.kind, a.title, a.sub);
    }
  }

  if (node.startTimer) startTimer(node.startTimer);

  // external push notification (top toast), once per run
  if (!notifShown && (node.notif || id === "on_the_way" || id === "agree_start" || id === "give_data")) {
    notifShown = true;
    await new Promise(r => setTimeout(r, 800));
    if (node.notif) {
      addNotif(node.notif.name, node.notif.body);
    } else {
      const alts = [
        { name: "Мама", body: "Ты где? Когда будешь дома?" },
        { name: "Друг", body: "Ну что, нашёл подработку?" },
        { name: "Сестра", body: "Напиши, как будешь свободен" }
      ];
      const a = alts[Math.floor(Math.random() * alts.length)];
      addNotif(a.name, a.body);
    }
  }

  if (node.options && node.options.length) {
    await new Promise(r => setTimeout(r, 280));
    node.options.forEach(o => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.textContent = o.text;
      btn.onclick = () => chooseOption(o);
      optionsEl.appendChild(btn);
    });
  } else {
    // no options and not an ending — finish safely
    await new Promise(r => setTimeout(r, 300));
    showEnding("ignore");
  }
}

// Safer showEnding wrapper used by error paths — never restarts chat mid-run

  }
}

const ENTRY_IDS = Object.keys(ENTRIES);

function beginGame() {
  // random entry each launch
  currentEntry = ENTRY_IDS[Math.floor(Math.random() * ENTRY_IDS.length)] || "search";

  // reset run state
  stepChain.length = 0;
  notifShown = false;
  Object.keys(flags).forEach(k => { flags[k] = false; });
  Object.keys(techniques).forEach(k => { techniques[k] = false; });

  prologue.classList.add("hidden");
  endingEl.style.display = "none";
  endingEl.innerHTML = "";
  headerEl.classList.remove("hidden");
  chatEl.classList.remove("hidden");
  optionsEl.classList.remove("hidden");
  chatEl.innerHTML = "";
  optionsEl.innerHTML = "";
  playing = false;

  let plays = 0;
  try { plays = parseInt(localStorage.getItem("proph_plays") || "0", 10) || 0; } catch(e) {}
  applyPersona();
  try { localStorage.setItem("proph_plays", String(plays + 1)); } catch(e) {}

  const built = buildStartNode();
  story.start = {
    messages: built.messages,
    options: built.options
  };

  playNode("start").catch(err => {
    /* silent */
    showEnding("ignore");
  });
}

    } catch (e) {
      dEl.textContent = "";
    }

  // preview persona for next run

  const p = PERSONAS[plays % PERSONAS.length];

  const av = document.getElementById("lockAv");
  const prev = document.getElementById("lockPreview");

      newbie: "Привет) Ты тоже подработку ищешь? Могу рассказать как устроено…"
    };

  }
}
